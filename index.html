<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUSHI オープンチャット認証クイズ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #f7f8fa;
    color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 520px;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .logo {
    text-align: center;
    font-weight: 700;
    letter-spacing: .08em;
    font-size: 14px;
    margin-bottom: 8px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 8px;
  }
  .description {
    text-align: center;
    color: #666;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .progress {
    height: 7px;
    background: #eee;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    background: #222;
    transition: width .25s ease;
  }
  .question-number {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
  }
  .question {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 14px;
    padding: 14px 15px;
    margin: 10px 0;
    font-size: 15px;
    cursor: pointer;
    transition: .15s;
  }
  .option:hover { background: #f5f5f5; }
  .option.selected {
    border-color: #222;
    background: #f0f0f0;
  }
  .option.disabled { cursor: default; }
  .next, .restart {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: #222;
    color: #fff;
  }
  .next:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .result {
    text-align: center;
  }
  .result h2 {
    font-size: 25px;
    margin: 8px 0 12px;
  }
  .result p {
    line-height: 1.8;
    color: #555;
  }
  .code-box {
    margin: 22px 0 12px;
    padding: 18px;
    border: 1px dashed #aaa;
    border-radius: 16px;
    background: #fafafa;
  }
  .code-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 7px;
  }
  .code {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .12em;
    word-break: break-all;
  }
  .copy {
    width: 100%;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .note {
    font-size: 12px;
    color: #888;
    margin-top: 16px;
    line-height: 1.6;
  }
  .hidden { display: none; }
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <div id="quizScreen">
      <div class="logo">YUSHI FANBASE</div>
      <h1>ファン認証クイズ</h1>
      <div class="description">
        ユウシに関する3問のクイズに挑戦してください。<br>
        すべて正解すると参加コードが表示されます。
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question-number" id="questionNumber"></div>
      <div class="question" id="questionText"></div>
      <div id="options"></div>
      <button class="next" id="nextButton" disabled>次へ</button>
    </div>

    <div id="resultScreen" class="result hidden"></div>
  </div>
</div>

<script>
/*
 * 問題データ
 * correct は正解の選択肢番号を配列で指定します。
 * 複数正解にも対応しています。
 */
const allQuestions = [
  {
    question: "ユウシの出身地は？",
    options: ["① 石川県", "② 東京都", "③ 神奈川県", "④ 岡山県"],
    correct: [1]
  },
  {
    question: "ユウシの血液型は？",
    options: ["① A型", "② B型", "③ O型", "④ AB型"],
    correct: [0]
  },
  {
    question: "ユウシが実家で飼っている犬の名前は？",
    options: ["① おいも", "② といろ", "③ ゆる", "④ ころ"],
    correct: [1, 2]
  },
  {
    question: "ユウシの好きな色は？",
    options: ["① 赤", "② ピンク", "③ パールネオシャンパン", "④ 水色"],
    correct: [3]
  },
  {
    question: "ユウシが苦手な食べ物は？",
    options: ["① きゅうり", "② にんじん", "③ ブロッコリー", "④ カリフラワー"],
    correct: [2]
  },
  {
    question: "この中で歌い出しがユウシではない曲は？",
    options: [
      "① We Go（遥か地平線彼方へ〜）",
      "② Tears Are Falling（耳を澄ましたら君の声がするから〜）",
      "③ Hello Mellow（ちょっぴりBitter 時々泣きたくなる〜）",
      "④ YO-I-DON!（誰だってNeed you〜）"
    ],
    correct: [0]
  },
  {
    question: "この中でユウシと宿舎のルームメイトになったことがない人は？",
    options: ["① リク", "② ジェヒ", "③ リョウ", "④ サクヤ"],
    correct: [0, 2]
  }
];

// ★ここを実際のオープンチャット参加コードに変更してください
const OPENCHAT_CODE = "6896";

let selectedQuestions = [];
let currentIndex = 0;
let selectedOptions = new Set();

const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");
const questionNumber = document.getElementById("questionNumber");
const questionText = document.getElementById("questionText");
const optionsEl = document.getElementById("options");
const nextButton = document.getElementById("nextButton");
const progressBar = document.getElementById("progressBar");

// 7問からランダムに重複なしで3問選ぶ
function selectRandomQuestions() {
  const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
  selectedQuestions = shuffled.slice(0, 3);
}

function renderQuestion() {
  const q = selectedQuestions[currentIndex];
  selectedOptions = new Set();

  questionNumber.textContent = `QUESTION ${currentIndex + 1} / 3`;
  questionText.textContent = q.question;
  optionsEl.innerHTML = "";
  nextButton.disabled = true;

  progressBar.style.width = `${((currentIndex) / 3) * 100}%`;

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;

    button.addEventListener("click", () => {
      // 回答は1つだけ選択可能
      selectedOptions.clear();
      optionsEl.querySelectorAll(".option").forEach(btn => {
        btn.classList.remove("selected");
      });

      selectedOptions.add(index);
      button.classList.add("selected");
      nextButton.disabled = false;
    });

    optionsEl.appendChild(button);
  });
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every(v => b.includes(v));
}

nextButton.addEventListener("click", () => {
  const q = selectedQuestions[currentIndex];
  const answer = [...selectedOptions][0];

  // 正解が2つある問題は、どちらを選んでも正解
  if (!q.correct.includes(answer)) {
    showFailure();
    return;
  }

  currentIndex++;

  if (currentIndex >= 3) {
    showSuccess();
  } else {
    renderQuestion();
  }
});

function showSuccess() {
  progressBar.style.width = "100%";
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");

  resultScreen.innerHTML = `
    <div style="font-size:42px;">✓</div>
    <h2>認証完了</h2>
    <p>
      3問すべて正解です！<br>
      オープンチャットの参加コードをご確認ください。
    </p>

    <div class="code-box">
      <div class="code-label">参加コード</div>
      <div class="code" id="code">${escapeHtml(OPENCHAT_CODE)}</div>
    </div>

    <button class="copy" onclick="copyCode()">コードをコピー</button>
    <div class="note">
      ※参加コードを第三者へ共有しないようお願いします。
    </div>
  `;
}

function showFailure() {
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");

  resultScreen.innerHTML = `
    <div style="font-size:42px;">×</div>
    <h2>もう一度挑戦してください</h2>
    <p>
      回答が正しくありませんでした。<br>
      「もう一度挑戦する」を押すと、別の3問がランダムに出題されます。
    </p>
    <button class="restart" onclick="restartQuiz()">もう一度挑戦する</button>
  `;
}

function restartQuiz() {
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  currentIndex = 0;
  selectRandomQuestions();
  renderQuestion();
}

function copyCode() {
  navigator.clipboard.writeText(OPENCHAT_CODE).then(() => {
    const button = document.querySelector(".copy");
    button.textContent = "コピーしました";
    setTimeout(() => button.textContent = "コードをコピー", 1500);
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

selectRandomQuestions();
renderQuestion();
</script>
</body>
</html>
